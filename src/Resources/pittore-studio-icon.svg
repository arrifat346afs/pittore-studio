<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 400 400" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Photo editor icon, improved version</title>
  <desc>A complete semi-rounded violet square icon with a smaller, lighter dark-violet glass screen showing a full red, green and blue brush swoosh with softly rounded ends. A light silver tablet pen with a rounded gray nub starts at the tail of the stroke and rises steeply up and to the right, passing over the top edge of the screen without covering the swoosh.</desc>

  <defs>
    <clipPath id="tile">
      <rect x="0" y="0" width="400" height="400" rx="60"/>
    </clipPath>
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a98fff"/>
      <stop offset="1" stop-color="#5a36df"/>
    </linearGradient>
    <linearGradient id="gSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="gScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2868"/>
      <stop offset="1" stop-color="#1a1642"/>
    </linearGradient>
    <linearGradient id="gPen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7cfe2"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#tile)">
    <!-- Tile and sheen -->
    <rect x="0" y="0" width="400" height="400" fill="url(#gBody)"/>
    <rect x="0" y="0" width="400" height="170" fill="url(#gSheen)"/>

    <!-- Screen -->
    <rect x="44" y="76" width="312" height="248" rx="34" fill="url(#gScreen)"/>
    <rect x="45" y="77" width="310" height="246" rx="33" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.12"/>

    <!-- RGB brush swoosh, softened ends -->
    <g transform="translate(200,204) scale(1.2) translate(-202,-199)">
      <path d="M90,258 C128,244 150,200 196,172 C240,146 284,140 314,158 C284,148.7 240,154.7 196,180.7 C150,208.7 128,250 90,258 Z" fill="#ff3b4e" stroke="#ff3b4e" stroke-width="3" stroke-linejoin="round"/>
      <path d="M90,258 C128,250 150,208.7 196,180.7 C240,154.7 284,148.7 314,158 C284,157.3 240,163.3 196,189.3 C150,217.3 128,256 90,258 Z" fill="#2fd67a" stroke="#2fd67a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M90,258 C128,256 150,217.3 196,189.3 C240,163.3 284,157.3 314,158 C284,166 240,172 196,198 C150,226 128,262 90,258 Z" fill="#3d7bff" stroke="#3d7bff" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- Pen shadow -->
    <g transform="translate(5,7)" opacity="0.35">
      <g transform="translate(68,272) rotate(-62) scale(1.05)">
        <path d="M6,-3.2 Q16,-4.6 26,-8 L28,-8.8 L50,-13.4 H226 A13.4 13.4 0 0 1 226,13.4 H50 L28,8.8 L26,8 Q16,4.6 6,3.2 Z" fill="#0b0820"/>
      </g>
    </g>

    <!-- Tablet pen: rounded nub, gray cone, ridge step, lighter cone, metal ring, body -->
    <g transform="translate(68,272) rotate(-62) scale(1.05)">
      <path d="M54,-13.4 H226 A13.4 13.4 0 0 1 226,13.4 H54 Z" fill="url(#gPen)"/>
      <rect x="84" y="-6" width="60" height="12" rx="6" fill="#aab3c8"/>
      <line x1="114" y1="-6" x2="114" y2="6" stroke="#8c96b0" stroke-width="2"/>
      <path d="M26,-8.8 L50,-13.4 V13.4 L26,8.8 Z" fill="#b9c1d3"/>
      <path d="M6,-3.2 Q16,-4.6 26,-8 V8 Q16,4.6 6,3.2 Z" fill="#8f99b0"/>
      <rect x="50" y="-13.8" width="4" height="27.6" fill="#7f89a3"/>
      <path d="M2.8,-2.8 H7 V2.8 H2.8 A2.8,2.8 0 0 1 2.8,-2.8 Z" fill="#c3cadb"/>
    </g>
  </g>

  <!-- Tile rim -->
  <rect x="1.5" y="1.5" width="397" height="397" rx="58.5" fill="none" stroke="url(#gRim)" stroke-width="3"/>
</svg>
